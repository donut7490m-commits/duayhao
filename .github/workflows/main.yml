name: auto-fetch

on:
  schedule:
    - cron: '0 10 1,16 * *'  # รันอัตโนมัติทุกวันที่ 1 และ 16
  workflow_dispatch:          # เปิดให้กด Run manual เองได้

permissions:
  contents: write             # ให้สิทธิ์บันทึกและ push ไฟล์ลง Repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run sync_lottery script
        run: python sync_lottery.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-update lottery data" && git push)
