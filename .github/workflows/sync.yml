name: Sync Lottery Data Automatically

on:
  schedule:
    - cron: '0 0,12 * * *' # ดึงข้อมูลอัตโนมัติทุก 12 ชั่วโมง
  workflow_dispatch: # กดสั่งดึงข้อมูลเองได้ตลอดเวลา

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Lottery Data
        run: |
          curl -s "https://lotto.api.rayriffy.com/list/1" > data.json

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update lottery data.json"
          git push
