name: Auto Sync Lottery Every Draw Date

on:
  schedule:
    # ตั้งเวลาให้บอททำงานอัตโนมัติทุกวันที่ 1 และ 16 ของเดือน เวลา 16:30 น. (ไทย)
    - cron: '30 9 1,16 * *'
  workflow_dispatch: # ปล่อยให้กดปุ่มสั่งรันเองได้ด้วย

permissions:
  contents: write

jobs:
  auto-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 requests

      - name: Run Scraper Bot
        run: |
          python sync_lottery.py

      - name: Commit and Push if New Data Found
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-updated lottery draw data"
          git push
