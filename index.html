<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>huay | ระบบวิเคราะห์เชิงสถิติสลากกินแบ่งรัฐบาล</title>
    <!-- Google Fonts: Cinzel สำหรับหัวข้อสไตล์ Dark Souls และ Prompt สำหรับภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #08080a;
            --panel-bg: rgba(15, 15, 18, 0.92);
            --gold-primary: #c8aa6e;
            --gold-bright: #f0d89e;
            --gold-dim: #6e5d3b;
            --crimson: #9e1b1b;
            --ember-orange: #d9531e;
            --text-light: #dcd6cd;
            --text-muted: #7e7a72;
            --border-gold: 1px solid rgba(200, 170, 110, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(217, 83, 30, 0.08), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(158, 27, 27, 0.05), transparent 70%);
            color: var(--text-light);
            font-family: 'Prompt', sans-serif;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Dark Souls Style Header */
        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--gold-bright);
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(200, 170, 110, 0.4), 0 0 30px rgba(0,0,0,0.9);
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Divider Decoration */
        .ds-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            margin: 20px auto;
            width: 80%;
            position: relative;
        }
        .ds-divider::before {
            content: "◆";
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold-bright);
            font-size: 12px;
            background: var(--bg-dark);
            padding: 0 10px;
        }

        /* Category Tabs (หมวดหมู่ 2, 3, 6 ตัว) */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(20, 20, 25, 0.8);
            border: var(--border-gold);
            color: var(--gold-primary);
            font-family: 'Cinzel', 'Prompt', serif;
            font-size: 0.95rem;
            padding: 12px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
        }

        .tab-btn:hover {
            background: rgba(200, 170, 110, 0.15);
            color: var(--gold-bright);
            box-shadow: 0 0 12px rgba(200, 170, 110, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, rgba(158, 27, 27, 0.3), rgba(20, 20, 25, 0.9));
            border-color: var(--gold-bright);
            color: var(--gold-bright);
            box-shadow: 0 0 20px rgba(158, 27, 27, 0.5), inset 0 0 10px rgba(200, 170, 110, 0.2);
        }

        /* Section Titles */
        .section-header {
            font-family: 'Cinzel', 'Prompt', serif;
            color: var(--gold-bright);
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(200, 170, 110, 0.2);
            padding-bottom: 10px;
        }

        .section-header span {
            color: var(--ember-orange);
        }

        /* Prediction Grid (โซนบน: 20 โมเดล) */
        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .pred-card {
            background: var(--panel-bg);
            border: var(--border-gold);
            padding: 20px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .pred-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(217, 83, 30, 0.2), 0 0 10px rgba(200, 170, 110, 0.2);
        }

        .pred-card h3 {
            font-size: 0.9rem;
            color: var(--gold-primary);
            margin-bottom: 10px;
            font-weight: 600;
            border-bottom: 1px dashed rgba(200, 170, 110, 0.2);
            padding-bottom: 5px;
        }

        .pred-value {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px var(--ember-orange);
            text-align: center;
            margin: 12px 0;
            letter-spacing: 2px;
        }

        .pred-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
        }

        /* History Table (โซนล่าง: สถิตีย้อนหลัง) */
        .history-container {
            background: var(--panel-bg);
            border: var(--border-gold);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            font-family: 'Cinzel', 'Prompt', serif;
            background: rgba(30, 30, 38, 0.9);
            color: var(--gold-bright);
            padding: 14px;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--gold-dim);
            letter-spacing: 1px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(200, 170, 110, 0.1);
            font-size: 0.9rem;
            color: var(--text-light);
        }

        tr:hover {
            background: rgba(200, 170, 110, 0.05);
        }

        .number-badge {
            font-family: 'Cinzel', monospace;
            font-weight: bold;
            color: var(--gold-bright);
            font-size: 1.05rem;
            letter-spacing: 2px;
        }

        /* Status & API Banner */
        .status-bar {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .status-online {
            color: #4cd137;
        }

        /* Responsiveness */
        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .pred-value { font-size: 1.2rem; }
            .tab-btn { padding: 10px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>Lord of Numbers</h1>
        <p>ระบบประมวลผลเชิงสถิติและวิเคราะห์แนวโน้มสลากกินแบ่งรัฐบาล</p>
        <div class="ds-divider"></div>
    </header>

    <!-- แถบแสดงสถานะระบบ -->
    <div class="status-bar" id="status-bar">
        สถานะระบบ: <span class="status-online">กำลังประมวลผลข้อมูลสถิติ...</span>
    </div>

    <!-- ปุ่มเลือกหมวดหมู่ -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('2digits', event)">⚔️ รางวัลเลขท้าย 2 ตัว</button>
        <button class="tab-btn" onclick="switchCategory('3digits', event)">🛡️ รางวัลเลขหน้า / เลขท้าย 3 ตัว</button>
        <button class="tab-btn" onclick="switchCategory('6digits', event)">👑 รางวัลที่ 1</button>
    </div>

    <!-- โซนบน: แบบจำลองสถิติ 20 รูปแบบ -->
    <section>
        <div class="section-header">
            <span>🔥</span> การประมวลผลแนวโน้มประจำงวดถัดไป (แบบจำลองสถิติ 20 รูปแบบ)
        </div>
        <div class="predictions-grid" id="predictions-container">
            <!-- การ์ดทำนาย 20 โมเดลจะถูกสร้างด้วย JavaScript -->
        </div>
    </section>

    <!-- โซนล่าง: ฐานข้อมูลสถิติมวลรวมย้อนหลัง -->
    <section>
        <div class="section-header">
            <span>📜</span> ฐานข้อมูลสถิติมวลรวมย้อนหลัง
        </div>
        <div class="history-container">
            <table>
                <thead>
                    <tr>
                        <th>งวดวันที่</th>
                        <th>รางวัลที่ 1</th>
                        <th>รางวัลเลขหน้า 3 ตัว</th>
                        <th>รางวัลเลขท้าย 3 ตัว</th>
                        <th>รางวัลเลขท้าย 2 ตัว</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- รายการสถิติจะถูกนำมาแสดงที่นี่ -->
                </tbody>
            </table>
        </div>
    </section>

</div>

<script>
// --- 1. ข้อมูลสำรอง (Mock Data) ---
const mockLotteryData = [
    { date: "16 ต.ค. 2026", first: "011781", threeFront: ["392", "402"], threeBack: ["171", "255"], twoBack: "48" },
    { date: "01 ต.ค. 2026", first: "402701", threeFront: ["791", "912"], threeBack: ["058", "396"], twoBack: "70" },
    { date: "16 ก.ย. 2026", first: "730640", threeFront: ["060", "521"], threeBack: ["266", "041"], twoBack: "64" }
];

let currentData = [...mockLotteryData];
let activeCategory = '2digits';

// --- 2. ฟังก์ชันดึงข้อมูลสถิติจากระบบ ---
async function fetchLiveLotteryData() {
    const statusBar = document.getElementById('status-bar');
    statusBar.innerHTML = `สถานะระบบ: <span style="color:#f1c40f;">● กำลังประมวลผลข้อมูลสถิติ...</span>`;

    try {
        const response = await fetch('./data.json', { cache: 'no-cache' });
        if (!response.ok) throw new Error('ไม่พบไฟล์ data.json ในระบบ');

        const json = await response.json();
        const list = json.history || json.response;

        if (list && list.length > 0) {
            currentData = list.map(item => ({
                date: item.date,
                first: item.first_prize || (item.running ? item.running[0] : "──────"),
                threeFront: item.front_three || item.running3Front || ["───", "───"],
                threeBack: item.last_three || item.running3Back || ["───", "───"],
                twoBack: item.last_two || item.running2Back || "──"
            }));

            statusBar.innerHTML = `สถานะระบบ: <span class="status-online">● เชื่อมต่อและดึงข้อมูลสถิติล่าสุดสมบูรณ์ (${currentData.length} งวด)</span>`;
            updateUI();
            return;
        }
    } catch (err) {
        console.warn("⚠️ ข้อผิดพลาดในการเชื่อมต่อ:", err);
    }

    statusBar.innerHTML = `สถานะระบบ: <span style="color:#e74c3c;">● ประมวลผลด้วยฐานข้อมูลสถิติสำรอง (Offline Mode)</span>`;
    updateUI();
}

// --- 3. ฟังก์ชันสลับหมวดหมู่ ---
function switchCategory(cat, evt) {
    activeCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (evt && evt.target) evt.target.classList.add('active');
    updateUI();
}

// --- 4. ฟังก์ชันจัดหมวดหมู่ตัวเลข ---
function getCategoryNumbers(item) {
    if (activeCategory === '2digits') return [item.twoBack];
    if (activeCategory === '3digits') return [...(item.threeFront || []), ...(item.threeBack || [])];
    if (activeCategory === '6digits') return [item.first];
    return [];
}

// --- 5. อัลกอริทึมแบบจำลองสถิติ 20 รูปแบบ ( dynamic 20 predictions ) ---
function generate20Predictions() {
    const allNumbers = [];
    currentData.forEach(item => {
        allNumbers.push(...getCategoryNumbers(item));
    });

    if (allNumbers.length === 0) return [];

    // 1. ความถี่ระยะยาว (สถิติมวลรวมทั้งหมด)
    const longTermCounts = {};
    for (let i = 0; i <= 9; i++) longTermCounts[i] = 0;
    allNumbers.forEach(numStr => {
        if (!numStr || numStr.includes('─')) return;
        numStr.split('').forEach(d => {
            if (longTermCounts[d] !== undefined) longTermCounts[d]++;
        });
    });
    const sortedLT = Object.keys(longTermCounts).sort((a,b) => longTermCounts[b] - longTermCounts[a]);

    // 2. ความถี่ระยะสั้น (โมเมนตัม 5 งวดล่าสุด)
    const shortTermNumbers = allNumbers.slice(0, 5);
    const shortTermCounts = {};
    for (let i = 0; i <= 9; i++) shortTermCounts[i] = 0;
    shortTermNumbers.forEach(numStr => {
        if (!numStr || numStr.includes('─')) return;
        numStr.split('').forEach(d => {
            if (shortTermCounts[d] !== undefined) shortTermCounts[d]++;
        });
    });
    const sortedST = Object.keys(shortTermCounts).sort((a,b) => shortTermCounts[b] - shortTermCounts[a]);

    const lt0 = sortedLT[0] || '0', lt1 = sortedLT[1] || '1', lt2 = sortedLT[2] || '2', lt3 = sortedLT[3] || '3';
    const st0 = sortedST[0] || '0', st1 = sortedST[1] || '1', st2 = sortedST[2] || '2';
    const cold0 = sortedLT[sortedLT.length - 1] || '9', cold1 = sortedLT[sortedLT.length - 2] || '8';

    // คำนวณ Ensemble 3 ลำดับสายสถิติ
    let mode1 = "", mode2 = "", mode3 = "";

    if (activeCategory === '2digits') {
        mode1 = `${lt0}${lt1}`;            // สายสถิติตลอดกาล (Long-term Base)
        mode2 = `${lt0}${cold0}`;          // สายสมดุลกระจายตัว (Cold Mix)
        mode3 = `${st0}${st1}`;            // สายโมเมนตัมระยะสั้น (Short-term Trend)
    } else if (activeCategory === '3digits') {
        mode1 = `${lt0}${lt1}${lt2}`;
        mode2 = `${lt0}${lt2}${cold0}`;
        mode3 = `${st0}${st1}${st2}`;
    } else if (activeCategory === '6digits') {
        mode1 = `${lt0}${lt1}${lt2}${lt3}${sortedLT[4]||'4'}${sortedLT[5]||'5'}`;
        mode2 = `${lt0}${cold0}${lt1}${cold1}${lt2}${st0}`;
        mode3 = `${st0}${st1}${st2}${lt0}${lt1}${lt2}`;
    }

    const ensembleHTML = `
        <div style="font-size: 0.85rem; text-align: left; padding: 0 5px; line-height: 1.6;">
            <div><span style="color:var(--gold-primary);">1. สายสถิติตลอดกาล:</span> <strong style="color:var(--gold-bright);">${mode1}</strong></div>
            <div><span style="color:var(--gold-primary);">2. สายสมดุลกระจายตัว:</span> <strong style="color:var(--gold-bright);">${mode2}</strong></div>
            <div><span style="color:var(--gold-primary);">3. สายโมเมนตัมระยะสั้น:</span> <strong style="color:var(--gold-bright);">${mode3}</strong></div>
        </div>
    `;

    return [
        { title: "1. ความถี่สูงสุดระยะยาว (Long-Term Top)", val: `ตัวเลขเด่น: ${lt0}`, desc: `ปรากฏ ${longTermCounts[lt0]} ครั้ง ตลอดชุดสถิติมวลรวม` },
        { title: "2. ตัวเลขหมุนเวียนต่ำ (Cold Digit)", val: `ตัวเลขอ่อน: ${cold0}`, desc: `ปรากฏน้อยที่สุด (${longTermCounts[cold0]} ครั้ง) รอการกระจายตัวเข้าสู่สมดุล` },
        { title: "3. ตำแหน่งหลักแรก (First Digit Analysis)", val: getTopFirstDigit(allNumbers), desc: "ประเมินความน่าจะเป็นของตัวเลขในตำแหน่งแรกสุด" },
        { title: "4. ตำแหน่งหลักท้าย (Last Digit Analysis)", val: getTopLastDigit(allNumbers), desc: "ประเมินความน่าจะเป็นของตัวเลขในตำแหน่งท้ายสุด" },
        { title: "5. สมดุลสูง/ต่ำ (High/Low Ratio)", val: getHighLowTrend(longTermCounts), desc: "สัดส่วนเปรียบเทียบกลุ่มตัวเลขต่ำ (0-4) และกลุ่มตัวเลขสูง (5-9)" },
        { title: "6. สมดุลคู่/คี่ (Even/Odd Ratio)", val: getOddEvenTrend(longTermCounts), desc: "วิเคราะห์ความสมดุลระหว่างกลุ่มตัวเลขคู่และตัวเลขคี่" },
        { title: "7. ค่าเฉลี่ยผลรวม (Mean Sum Value)", val: getAverageSum(allNumbers), desc: "ค่าเฉลี่ยเลขคณิตของผลรวมตัวเลขทุกหลักในหมวดหมู่" },
        { title: "8. แนวโน้มลูกโซ่ (Markov Chain)", val: getMarkovNext(allNumbers), desc: "การคาดการณ์ตัวเลขสืบเนื่องจากผลการออกรางวัลงวดล่าสุด" },
        { title: "9. ถ่วงน้ำหนักระยะใกล้ (Recency Weighted)", val: getWeightedRecent(allNumbers), desc: "ให้ดัชนีน้ำหนักความสำคัญแก่ข้อมูลสถิติงวดล่าสุด" },
        { title: "10. การประมวลผลรวม (Composite Model)", val: `แนวทางเด่น: ${lt0}${lt1}`, desc: "การจับคู่โครงสร้างตัวเลขที่มีดัชนีความน่าจะเป็นสูงสุด" },
        { title: "11. โมเมนตัม 5 งวดล่าสุด (Short-Term Momentum)", val: `ตัวเลขเร่ง: ${st0}`, desc: "วิเคราะห์ความถี่เฉพาะสถิติ 5 งวดล่าสุดเพื่อจับกระแส" },
        { title: "12. ดัชนีตัวเลขดับลำดับสอง (Secondary Cold)", val: `ตัวเลขดับ: ${cold1}`, desc: "ตัวเลขที่มีอัตราการหมุนเวียนปรากฏต่ำในลำดับรอง" },
        { title: "13. การจับคู่ความถี่สูง (Top Pair Frequency)", val: `ชุดคู่เด่น: ${lt0}-${lt2}`, desc: "การจับคู่ระหว่างตัวเลขความถี่อันดับ 1 และอันดับ 3" },
        { title: "14. ค่าส่วนต่างงวดล่าสุด (Delta Difference)", val: getDeltaDiff(allNumbers), desc: "ผลต่างเชิงจำนวนระหว่างหลักแรกและหลักท้ายงวดล่าสุด" },
        { title: "15. พิสัยการกระจายตัว (Variance Dispersion)", val: `พิสัย: ${longTermCounts[lt0] - longTermCounts[cold0]}`, desc: "ส่วนต่างความถี่ระหว่างตัวเลขที่ออกบ่อยที่สุดและน้อยที่สุด" },
        { title: "16. ตำแหน่งหลักกลาง (Middle Digit Analysis)", val: getTopMiddleDigit(allNumbers), desc: "วิเคราะห์ตัวเลขที่มีอัตราความถี่สูงสุดในตำแหน่งกึ่งกลาง" },
        { title: "17. การแจกแจงปัวซซง (Poisson Expected)", val: `ค่าคาดหมาย: ${lt1}`, desc: "ตัวเลขที่มีค่าคาดหมายการกระจายตัวเข้าสู่จุดสมดุล" },
        { title: "18. ส่วนเบี่ยงเบนมาตรฐาน (Standard Deviation)", val: getStdDevRange(allNumbers), desc: "ขอบเขตส่วนเบี่ยงเบนมาตรฐานของผลรวมตัวเลข" },
        { title: "19. รอบวัฏจักรซ้ำ (Cyclic Repeat Trend)", val: `แนวโน้มซ้ำ: ${lt0}`, desc: "ประเมินตัวเลขที่มีโอกาสปรากฏซ้ำตามรอบวัฏจักร" },
        { title: "20. แบบจำลองสถิติรวม 3 สาย (3-Horizon Ensemble)", val: ensembleHTML, desc: "สรุปการประมวลผลแบ่งตามสายสถิติตลอดกาล, สายสมดุล, และโมเมนตัมระยะสั้น" }
    ];
}

// --- ฟังก์ชันย่อยคำนวณโมเดลทางสถิติ ---
function getTopFirstDigit(list) {
    const counts = {};
    list.forEach(n => { if(n && !n.includes('─')) counts[n[0]] = (counts[n[0]] || 0) + 1; });
    const top = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
    return `หลักแรกเด่น: ${top || '-'}`;
}

function getTopLastDigit(list) {
    const counts = {};
    list.forEach(n => { if(n && !n.includes('─')) counts[n[n.length-1]] = (counts[n[n.length-1]] || 0) + 1; });
    const top = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
    return `หลักท้ายเด่น: ${top || '-'}`;
}

function getHighLowTrend(counts) {
    let low = 0, high = 0;
    for(let i=0; i<=4; i++) low += counts[i] || 0;
    for(let i=5; i<=9; i++) high += counts[i] || 0;
    return high > low ? "แนวโน้ม: กลุ่มเลขสูง (5-9)" : "แนวโน้ม: กลุ่มเลขต่ำ (0-4)";
}

function getOddEvenTrend(counts) {
    let even = 0, odd = 0;
    for(let i=0; i<=9; i++) {
        if(i % 2 === 0) even += counts[i] || 0;
        else odd += counts[i] || 0;
    }
    return odd > even ? "ดัชนีเด่น: กลุ่มตัวเลขคี่" : "ดัชนีเด่น: กลุ่มตัวเลขคู่";
}

function getAverageSum(list) {
    let total = 0, count = 0;
    list.forEach(numStr => {
        if(!numStr || numStr.includes('─')) return;
        numStr.split('').forEach(d => { total += Number(d); count++; });
    });
    const avg = count ? Math.round(total / list.length) : 0;
    return `แต้มรวมเฉลี่ย: ${avg}`;
}

function getMarkovNext(list) {
    if(!list[0] || list[0].includes('─')) return "สถิติส่งผล: -";
    const lastNum = list[0];
    return `สถิติส่งผลตาม: ${lastNum[lastNum.length-1]}`;
}

function getWeightedRecent(list) {
    if(!list[0] || list[0].includes('─')) return "เน้นวิ่ง: -";
    return `เน้นวิ่ง: ${list[0][0]}`;
}

function getDeltaDiff(list) {
    if(!list[0] || list[0].includes('─')) return "ค่าผลต่าง: 0";
    const n = list[0];
    const diff = Math.abs(Number(n[0]) - Number(n[n.length - 1]));
    return `ค่าผลต่าง: ${diff}`;
}

function getTopMiddleDigit(list) {
    const counts = {};
    list.forEach(n => {
        if(!n || n.includes('─')) return;
        const midIdx = Math.floor(n.length / 2);
        counts[n[midIdx]] = (counts[n[midIdx]] || 0) + 1;
    });
    const top = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
    return `หลักกลางเด่น: ${top || '-'}`;
}

function getStdDevRange(list) {
    const sums = [];
    list.forEach(numStr => {
        if(!numStr || numStr.includes('─')) return;
        let sum = 0;
        numStr.split('').forEach(d => sum += Number(d));
        sums.push(sum);
    });
    if(!sums.length) return "ช่วงเบี่ยงเบน: ±0";
    const mean = sums.reduce((a,b) => a+b, 0) / sums.length;
    const variance = sums.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / sums.length;
    const stdDev = Math.sqrt(variance).toFixed(1);
    return `ช่วงเบี่ยงเบน: ±${stdDev}`;
}
