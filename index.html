<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORD OF NUMBERS | คัมภีร์ทำนายสลากกินแบ่ง</title>
    <!-- Google Fonts: Cinzel สำหรับหัวข้อสไตล์ Dark Souls และ Prompt สำหรับภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #08080a;
            --panel-bg: rgba(15, 15, 18, 0.92);
            --gold-primary: #c8aa6e;
            --gold-bright: #f0d89e;
            --gold-dim: #6e5d3b;
            --crimson: #9e1b1b;
            --ember-orange: #d9531e;
            --text-light: #dcd6cd;
            --text-muted: #7e7a72;
            --border-gold: 1px solid rgba(200, 170, 110, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(217, 83, 30, 0.08), transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(158, 27, 27, 0.05), transparent 70%);
            color: var(--text-light);
            font-family: 'Prompt', sans-serif;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Dark Souls Style Header */
        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--gold-bright);
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(200, 170, 110, 0.4), 0 0 30px rgba(0,0,0,0.9);
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* Divider Decoration */
        .ds-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            margin: 20px auto;
            width: 80%;
            position: relative;
        }
        .ds-divider::before {
            content: "◆";
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--gold-bright);
            font-size: 12px;
            background: var(--bg-dark);
            padding: 0 10px;
        }

        /* Category Tabs (หมวดหมู่ 2, 3, 6 ตัว) */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(20, 20, 25, 0.8);
            border: var(--border-gold);
            color: var(--gold-primary);
            font-family: 'Cinzel', 'Prompt', serif;
            font-size: 1rem;
            padding: 12px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
        }

        .tab-btn:hover {
            background: rgba(200, 170, 110, 0.15);
            color: var(--gold-bright);
            box-shadow: 0 0 12px rgba(200, 170, 110, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, rgba(158, 27, 27, 0.3), rgba(20, 20, 25, 0.9));
            border-color: var(--gold-bright);
            color: var(--gold-bright);
            box-shadow: 0 0 20px rgba(158, 27, 27, 0.5), inset 0 0 10px rgba(200, 170, 110, 0.2);
        }

        /* Section Titles */
        .section-header {
            font-family: 'Cinzel', 'Prompt', serif;
            color: var(--gold-bright);
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(200, 170, 110, 0.2);
            padding-bottom: 10px;
        }

        .section-header span {
            color: var(--ember-orange);
        }

        /* Prediction Grid (โซนบน: 10 โมเดล) */
        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .pred-card {
            background: var(--panel-bg);
            border: var(--border-gold);
            padding: 20px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .pred-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(217, 83, 30, 0.2), 0 0 10px rgba(200, 170, 110, 0.2);
        }

        .pred-card h3 {
            font-size: 0.95rem;
            color: var(--gold-primary);
            margin-bottom: 10px;
            font-weight: 600;
            border-bottom: 1px dashed rgba(200, 170, 110, 0.2);
            padding-bottom: 5px;
        }

        .pred-value {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px var(--ember-orange);
            text-align: center;
            margin: 12px 0;
            letter-spacing: 2px;
        }

        .pred-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* History Table (โซนล่าง: สถิตีย้อนหลัง) */
        .history-container {
            background: var(--panel-bg);
            border: var(--border-gold);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            font-family: 'Cinzel', 'Prompt', serif;
            background: rgba(30, 30, 38, 0.9);
            color: var(--gold-bright);
            padding: 14px;
            font-size: 0.95rem;
            border-bottom: 2px solid var(--gold-dim);
            letter-spacing: 1px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(200, 170, 110, 0.1);
            font-size: 0.95rem;
            color: var(--text-light);
        }

        tr:hover {
            background: rgba(200, 170, 110, 0.05);
        }

        .number-badge {
            font-family: 'Cinzel', monospace;
            font-weight: bold;
            color: var(--gold-bright);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        /* Status & API Banner */
        .status-bar {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .status-online {
            color: #4cd137;
        }

        /* Responsiveness */
        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .pred-value { font-size: 1.4rem; }
            .tab-btn { padding: 10px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>Lord of Numbers</h1>
        <p>คัมภีร์วิเคราะห์สถิติ & ทำนายชะตากรรมสลากกินแบ่งรัฐบาล</p>
        <div class="ds-divider"></div>
    </header>

    <!-- บาร์บอกสถานะการดึงข้อมูล -->
    <div class="status-bar" id="status-bar">
        สถานะการเชื่อมต่อ: <span class="status-online">กำลังโหลดข้อมูลล่าสุด...</span>
    </div>

    <!-- ปุ่มสลับหมวดหมู่ 2 ตัว, 3 ตัว, 6 ตัว -->
    <div class="category-tabs">
        <button class="tab-btn active" onclick="switchCategory('2digits')">⚔️ เลขท้าย 2 ตัว</button>
        <button class="tab-btn" onclick="switchCategory('3digits')">🛡️ เลข 3 ตัว (ท้าย/หน้า)</button>
        <button class="tab-btn" onclick="switchCategory('6digits')">👑 รางวัลที่ 1 (6 ตัว)</button>
    </div>

    <!-- โซนบน: แนวโน้มที่จะออก (10 โมเดลการทำนาย) -->
    <section>
        <div class="section-header">
            <span>🔥</span> แนวโน้มการออกงวดถัดไป (10 โมเดลทำนาย)
        </div>
        <div class="predictions-grid" id="predictions-container">
            <!-- การ์ดทำนายจะถูกสร้างผ่าน JS -->
        </div>
    </section>

    <!-- โซนล่าง: คลังสถิตีย้อนหลัง -->
    <section>
        <div class="section-header">
            <span>📜</span> คลังสถิตีย้อนหลัง
        </div>
        <div class="history-container">
            <table>
                <thead>
                    <tr>
                        <th>งวดวันที่</th>
                        <th>รางวัลที่ 1</th>
                        <th>เลขหน้า 3 ตัว</th>
                        <th>เลขท้าย 3 ตัว</th>
                        <th>เลขท้าย 2 ตัว</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <!-- รายการสถิติจะถูกนำมาแสดงที่นี่ -->
                </tbody>
            </table>
        </div>
    </section>

</div>

<script>
// --- 1. ข้อมูลสำรอง (Mock Data) เผื่อกรณีติดต่อ API ไม่ได้ ---
const mockLotteryData = [
    { date: "16 มี.ค. 2026", first: "682904", threeFront: ["241", "730"], threeBack: ["583", "912"], twoBack: "89" },
    { date: "01 มี.ค. 2026", first: "419532", threeFront: ["112", "380"], threeBack: ["645", "809"], twoBack: "53" },
    { date: "16 ก.พ. 2026", first: "920109", threeFront: ["054", "311"], threeBack: ["872", "990"], twoBack: "09" },
    { date: "01 ก.พ. 2026", first: "753889", threeFront: ["200", "591"], threeBack: ["143", "728"], twoBack: "89" },
    { date: "17 ม.ค. 2026", first: "124961", threeFront: ["450", "892"], threeBack: ["331", "604"], twoBack: "61" },
    { date: "30 ธ.ค. 2025", first: "538238", threeFront: ["129", "640"], threeBack: ["085", "417"], twoBack: "38" },
    { date: "16 ธ.ค. 2025", first: "841089", threeFront: ["339", "701"], threeBack: ["210", "955"], twoBack: "89" },
    { date: "01 ธ.ค. 2025", first: "092314", threeFront: ["104", "552"], threeBack: ["480", "829"], twoBack: "14" },
    { date: "16 พ.ย. 2025", first: "619253", threeFront: ["082", "419"], threeBack: ["361", "740"], twoBack: "53" },
    { date: "01 พ.ย. 2025", first: "384192", threeFront: ["221", "638"], threeBack: ["109", "584"], twoBack: "92" }
];

let currentData = [...mockLotteryData];
let activeCategory = '2digits'; // ค่าเริ่มต้น: เลขท้าย 2 ตัว

// --- 2. ฟังก์ชันดึงข้อมูลจาก Open API (RayRiffy Lottery API) อัตโนมัติ ---
// --- ฟังก์ชันดึงข้อมูลจาก Open API (พร้อมระบบทะลุบล็อก CORS) ---
// --- ฟังก์ชันดึงข้อมูลแบบ Multi-Proxy (สลับตัวกลางให้อัตโนมัติหากตัวแรกช้า) ---
// --- ฟังก์ชันดึงข้อมูลล็อตเตอรี่สด ทะลุการบล็อก CORS ของ API ---
// --- ฟังก์ชันดึงข้อมูลแบบ JSON Wrapper ทะลุ CORS ได้ 100% ไม่ติดบล็อก ---
// --- ฟังก์ชันดึงข้อมูลจากไฟล์ภายในระบบ (การันตีออนไลน์ 100% ไม่ติด CORS) ---
async function fetchLiveLotteryData() {
    const statusBar = document.getElementById('status-bar');

    statusBar.innerHTML = `สถานะการเชื่อมต่อ: <span style="color:#f1c40f;">● กำลังโหลดข้อมูลสถิติ...</span>`;

    try {
        // ดึงไฟล์ data.json ที่บอทสร้างไว้ให้ในเว็บ
        const response = await fetch('./data.json', { cache: 'no-cache' });
        
        if (!response.ok) throw new Error('ยังไม่มีไฟล์ data.json ในระบบ');

        const json = await response.json();

        if (json && json.response && json.response.length > 0) {
            currentData = json.response.map(item => ({
                date: item.date,
                first: item.running[0] || "──────",
                threeFront: item.running3Front || ["───", "───"],
                threeBack: item.running3Back || ["───", "───"],
                twoBack: item.running2Back || "──"
            }));

            statusBar.innerHTML = `สถานะการเชื่อมต่อ: <span class="status-online">● อัปเดตข้อมูลล่าสุดจาก Server เรียบร้อย</span>`;
            console.log("✅ ดึงข้อมูลสำเร็จ:", currentData);
            updateUI();
            return;
        }
    } catch (err) {
        console.warn("⚠️ ไม่พบไฟล์ data.json หรือกำลังรอดึงครั้งแรก:", err);
    }

    statusBar.innerHTML = `สถานะการเชื่อมต่อ: <span style="color:#e74c3c;">● ใช้ข้อมูลสถิติในระบบคลัง (Offline Mode)</span>`;
    updateUI();
}

// --- 3. ฟังก์ชันสลับหมวดหมู่ ---
function switchCategory(cat) {
    activeCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    updateUI();
}

// --- 4. ฟังก์ชันดึงตัวเลขตามหมวดหมู่ปัจจุบัน ---
function getCategoryNumbers(item) {
    if (activeCategory === '2digits') return [item.twoBack];
    if (activeCategory === '3digits') return [...item.threeFront, ...item.threeBack];
    if (activeCategory === '6digits') return [item.first];
    return [];
}

// --- 5. อัลกอริทึมทำนาย 10 รูปแบบ (Predictions Core) ---
function generate10Predictions() {
    const allNumbers = [];
    currentData.forEach(item => {
        allNumbers.push(...getCategoryNumbers(item));
    });

    const digitCounts = {};
    for (let i = 0; i <= 9; i++) digitCounts[i] = 0;

    allNumbers.forEach(numStr => {
        if (!numStr || numStr.includes('─')) return;
        numStr.split('').forEach(d => {
            if (digitCounts[d] !== undefined) digitCounts[d]++;
        });
    });

    const sortedDigitsByFreq = Object.keys(digitCounts).sort((a,b) => digitCounts[b] - digitCounts[a]);
    const mostFreqDigit = sortedDigitsByFreq[0];
    const leastFreqDigit = sortedDigitsByFreq[sortedDigitsByFreq.length - 1];

    // คำนวณโมเดลทั้ง 10
    return [
        { title: "1. Hot Embers (เลขออกบ่อยสุด)", val: `เลขเด่น: ${mostFreqDigit}`, desc: `ปรากฏทั้งหมด ${digitCounts[mostFreqDigit]} ครั้งในสถิติตามหมวด` },
        { title: "2. Cold Ashes (เลขดับ/ไม่ออกนาน)", val: `เลขดับ: ${leastFreqDigit}`, desc: `พบเพียง ${digitCounts[leastFreqDigit]} ครั้ง มีโอกาสสุ่มโดนตามรอบสะสม` },
        { title: "3. First Digit Mastery (สถิติหลักแรก)", val: getTopFirstDigit(allNumbers), desc: "วิเคราะห์ตัวเลขที่มีอัตราออกบ่อยที่สุดในตำแหน่งหน้าสุด" },
        { title: "4. Last Digit Anchor (สถิติหลักท้าย)", val: getTopLastDigit(allNumbers), desc: "วิเคราะห์ตัวเลขที่มีอัตราออกบ่อยที่สุดในตำแหน่งท้ายสุด" },
        { title: "5. High/Low Balance (สูง/ต่ำ)", val: getHighLowTrend(digitCounts), desc: "ประเมินสัดส่วนกลุ่มเลขต่ำ (0-4) เทียบกับกลุ่มเลขสูง (5-9)" },
        { title: "6. Odd/Even Fate (คู่/คี่)", val: getOddEvenTrend(digitCounts), desc: "วิเคราะห์สมดุลของเลขคู่และเลขคี่ในภาพรวมงวดล่าสุด" },
        { title: "7. Average Sum Range (ผลรวมเฉลี่ย)", val: getAverageSum(allNumbers), desc: "ค่าเฉลี่ยผลรวมของตัวเลขทุกหลักในหมวดนี้" },
        { title: "8. Markov Chain (เลขตามงวดล่าสุด)", val: getMarkovNext(allNumbers), desc: "วิเคราะห์แนวโน้มตัวเลขที่จะออกตามหลังผลลัพธ์งวดล่าสุด" },
        { title: "9. Weighted Decay (ถ่วงน้ำหนักงวดล่าสุด)", val: `เน้นวิ่ง: ${allNumbers[0] ? allNumbers[0][0] : '7'}`, desc: "ให้ความสำคัญกับตัวเลขในงวดที่เพิ่งผ่านมาไม่นานมากที่สุด" },
        { title: "10. Master Prediction (สรุปเด่นรวม)", val: `${mostFreqDigit}${sortedDigitsByFreq[1] || '0'}`, desc: "การจับคู่ตัวเลขทรงพลังที่สุดจากการคำนวณสถิติรวม" }
    ];
}

// ฟังก์ชันย่อยสำหรับช่วยคำนวณโมเดล
function getTopFirstDigit(list) {
    const counts = {};
    list.forEach(n => { if(n) counts[n[0]] = (counts[n[0]] || 0) + 1; });
    const top = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
    return `หลักแรกเด่น: ${top || '-'}`;
}

function getTopLastDigit(list) {
    const counts = {};
    list.forEach(n => { if(n) counts[n[n.length-1]] = (counts[n[n.length-1]] || 0) + 1; });
    const top = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
    return `หลักท้ายเด่น: ${top || '-'}`;
}

function getHighLowTrend(counts) {
    let low = 0, high = 0;
    for(let i=0; i<=4; i++) low += counts[i];
    for(let i=5; i<=9; i++) high += counts[i];
    return high > low ? "แนวโน้ม: เลขสูง (5-9)" : "แนวโน้ม: เลขต่ำ (0-4)";
}

function getOddEvenTrend(counts) {
    let even = 0, odd = 0;
    for(let i=0; i<=9; i++) {
        if(i % 2 === 0) even += counts[i];
        else odd += counts[i];
    }
    return odd > even ? "เด่น: กลุ่มเลขคี่" : "เด่น: กลุ่มเลขคู่";
}

function getAverageSum(list) {
    let total = 0, count = 0;
    list.forEach(numStr => {
        if(!numStr) return;
        numStr.split('').forEach(d => { total += Number(d); count++; });
    });
    const avg = count ? Math.round(total / list.length) : 0;
    return `แต้มรวมเฉลี่ย: ${avg}`;
}

function getMarkovNext(list) {
    if(!list[0]) return "เด่น: -";
    const lastNum = list[0];
    return `สถิติส่งผลตาม: ${lastNum[lastNum.length-1]}`;
}

// --- 6. อัปเดต UI หน้าจอ ---
function updateUI() {
    // Rend 10 Predictions
    const predContainer = document.getElementById('predictions-container');
    predContainer.innerHTML = '';
    const predictions = generate10Predictions();

    predictions.forEach(p => {
        const card = document.createElement('div');
        card.className = 'pred-card';
        card.innerHTML = `
            <h3>${p.title}</h3>
            <div class="pred-value">${p.val}</div>
            <div class="pred-desc">${p.desc}</div>
        `;
        predContainer.appendChild(card);
    });

    // Render History Table
    const tbody = document.getElementById('history-table-body');
    tbody.innerHTML = '';

    currentData.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${row.date}</td>
            <td class="number-badge" style="${activeCategory==='6digits'?'color:var(--ember-orange);':''}">${row.first}</td>
            <td>${row.threeFront.join(', ')}</td>
            <td style="${activeCategory==='3digits'?'color:var(--gold-bright);font-weight:bold;':''}">${row.threeBack.join(', ')}</td>
            <td class="number-badge" style="${activeCategory==='2digits'?'color:var(--ember-orange);':''}">${row.twoBack}</td>
        `;
        tbody.appendChild(tr);
    });
}

// เริ่มทำงานเมื่อเปิดหน้าเว็บ
fetchLiveLotteryData();
</script>

</body>
</html>
